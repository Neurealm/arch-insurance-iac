name: Terraform static validation

on:
  pull_request:
    paths:
      - "terraform/**"
      - "runner/**"
      - "supabase/functions/terraform-orchestrator/**"
      - "supabase/functions/terraform-drafting-agent/**"
      - "supabase/functions/terraform-ci-remediation-agent/**"
      - "supabase/functions/_shared/terraform-draft-policy*"
      - "scripts/validate-terraform-drafts.ts"
      - "supabase/migrations/*terraform*"
      - "supabase/migrations/*remediation*"
      - ".github/workflows/terraform-static-validation.yml"
      - ".github/workflows/hcp-terraform-authentication-test.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "supabase/functions/terraform-drafting-agent/**"
      - "supabase/functions/terraform-ci-remediation-agent/**"
      - "supabase/functions/_shared/terraform-draft-policy*"
      - "scripts/validate-terraform-drafts.ts"
      - "supabase/migrations/*remediation*"
      - ".github/workflows/terraform-static-validation.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.6"
      # Parse untrusted drafts before terraform init could install a provider.
      # No HCP/Azure/GitHub secrets are exposed to the validator or Terraform.
      - name: Test draft HCL security policy
        # GopherJS's Go runtime enumerates process.env during initialization.
        # No cloud credentials are supplied; no network/run/read is granted.
        run: deno test --allow-env --no-config --no-lock --node-modules-dir=none supabase/functions/_shared/terraform-draft-policy.test.ts supabase/functions/terraform-ci-remediation-agent/policy.test.ts
      - name: Type-check Terraform agents
        run: deno check --no-config --no-lock --node-modules-dir=none supabase/functions/terraform-drafting-agent/index.ts supabase/functions/terraform-ci-remediation-agent/index.ts
      - name: Validate generated draft archives
        run: deno run --allow-env --no-config --no-lock --node-modules-dir=none --allow-read=terraform scripts/validate-terraform-drafts.ts
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"
      # An AI-drafted PR (terraform-drafting-agent) produces semantically
      # correct HCL but does not reliably reproduce terraform fmt's exact
      # alignment. Normalize formatting in the runner only -- no commit, no
      # push -- so a purely cosmetic diff never blocks these branches, while
      # `terraform validate` below (the real correctness gate) still applies
      # in full. Every human-authored branch is untouched and remains gated
      # by the strict fmt check exactly as before.
      - name: Normalize formatting for AI drafts
        if: startsWith(github.head_ref, 'ai-draft/')
        run: terraform fmt -recursive terraform
      - name: Formatting
        run: terraform fmt -check -recursive terraform
      - name: Validate pilot backend configuration
        working-directory: terraform/environments/pilot
        run: terraform init -backend=false && terraform validate
      - name: Validate HCP authentication check
        working-directory: terraform/hcp/authentication-check
        run: terraform init -backend=false && terraform validate
      - name: Validate runner job contract
        run: jq empty runner/contracts/terraform-job.schema.json
      - name: Validate every Terraform module and pilot root
        run: |
          set -e
          for dir in terraform/modules/*/ terraform/environments/pilot/*/; do
            echo "::group::Validate $dir"
            (cd "$dir" && terraform init -backend=false && terraform validate)
            echo "::endgroup::"
          done
