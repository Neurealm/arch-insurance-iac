name: Terraform static validation

on:
  pull_request:
    paths:
      - "terraform/**"
      - "runner/**"
      - "supabase/functions/terraform-orchestrator/**"
      - "supabase/migrations/*terraform*"
      - ".github/workflows/terraform-static-validation.yml"
      - ".github/workflows/hcp-terraform-authentication-test.yml"
  push:
    branches: [main]
    paths: ["terraform/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"
      # AI-drafted PRs (terraform-drafting-agent) commit their own best-effort
      # formatting; run the real terraform fmt here and push a fixup so a
      # purely cosmetic diff never blocks CI on those branches. Never applies
      # to human-authored branches -- the Formatting step below still gates
      # every other PR exactly as before.
      - name: Auto-format AI-drafted Terraform
        if: startsWith(github.head_ref, 'ai-draft/')
        run: |
          set -e
          terraform fmt -recursive terraform
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: terraform fmt (AI-draft auto-format)"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
      - name: Formatting
        run: terraform fmt -check -recursive terraform
      - name: Validate pilot backend configuration
        working-directory: terraform/environments/pilot
        run: terraform init -backend=false && terraform validate
      - name: Validate HCP authentication check
        working-directory: terraform/hcp/authentication-check
        run: terraform init -backend=false && terraform validate
      - name: Validate runner job contract
        run: jq empty runner/contracts/terraform-job.schema.json
      - name: Validate every Terraform module and pilot root
        run: |
          set -e
          for dir in terraform/modules/*/ terraform/environments/pilot/*/; do
            echo "::group::Validate $dir"
            (cd "$dir" && terraform init -backend=false && terraform validate)
            echo "::endgroup::"
          done
